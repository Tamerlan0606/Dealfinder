name: MarketStart CI
on:
  push:
    paths:
      - 'marketstart/**'
      - 'tests/test_marketstart.py'
      - '.github/workflows/marketstart-ci.yml'
  pull_request:
    paths:
      - 'marketstart/**'
      - 'tests/test_marketstart.py'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r marketstart/requirements.txt pytest httpx
      - run: pytest -q tests/test_marketstart.py
