name: MarketStart CI
on:
  push:
    paths:
      - 'marketstart/**'
      - 'tests/test_marketstart.py'
      - '.github/workflows/marketstart-ci.yml'
  pull_request:
    paths:
      - 'marketstart/**'
      - 'tests/test_marketstart.py'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r marketstart/requirements.txt pytest httpx
      - run: PYTHONPATH=. pytest -q tests/test_marketstart.py
