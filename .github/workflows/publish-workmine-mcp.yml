name: Publish WORKMINE MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workmine/server.json"
      - ".github/workflows/publish-workmine-mcp.yml"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validate descriptor
        run: ./mcp-publisher validate workmine/server.json
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish WORKMINE
        run: ./mcp-publisher publish workmine/server.json
