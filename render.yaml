services:
  - type: web
    name: dealfinder-mobile
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn run:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DRY_RUN
        value: "true"
      - key: MIN_MARGIN_RUB
        value: "200000"
      - key: MIN_MARGIN_PCT
        value: "10"
      - key: DB_PATH
        value: "/tmp/deals.db"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
