services:
  - type: web
    name: dealfinder-mobile
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn run:app --host 0.0.0.0 --port $PORT
    disk:
      name: dealfinder-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DRY_RUN
        value: "false"
      - key: MIN_MARGIN_RUB
        value: "200000"
      - key: MIN_MARGIN_PCT
        value: "10"
      - key: DB_PATH
        value: "/data/deals.db"
      - key: GOSPLAN_ENDPOINTS
        value: "/fz44/purchases,/fz223/purchases"
      - key: GOSPLAN_MAX_PAGES
        value: "3"
      - key: REFRESH_SECONDS
        value: "3600"
      - key: AUTO_REFRESH
        value: "true"
      - key: AUTO_REVIEW
        value: "true"
      - key: AUTO_REVIEW_LIMIT
        value: "20"
      - key: DEAL_BID_DISCOUNT_PCT
        value: "5"
      - key: DEAL_TAX_PCT
        value: "7"
      - key: DEAL_RISK_RESERVE_PCT
        value: "3"
      - key: DEAL_BG_FEE_PCT
        value: "1.5"
      - key: GOSPLAN_API_KEY
        sync: false
      - key: GOSPLAN_TEST_INTERVAL
        value: "2"
      - key: USE_GOSPLAN_TEST
        value: "true"
      - key: DEAL_MIN_RUB
        value: "10000000"
      - key: DEAL_MAX_RUB
        value: "90000000"
      - key: DEAL_MIN_ADVANCE_PCT
        value: "20"
      - key: DEAL_REGIONS
        value: "Ростовская область,Ставропольский край,Республика Ингушетия,Кабардино-Балкарская Республика,Республика Северная Осетия — Алания,Краснодарский край,Москва,Московская область"
      - key: DEAL_KEYWORDS
        value: "благоустройство,строитель,строительств,капитальн,ремонт,кровл,фасад,монтаж,озелен,площадк,тротуар,освещен,водопровод,канализац,теплоснабж,электромонтаж,общестро,стадион,спортив,маф,территор,уборк,клинин,клининг,содержан территор,зимн содержан,снег,снега,налед,сосул,очистк крыш,очистка кровл,механизированн уборк,ручн уборк"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
